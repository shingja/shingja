name: Profile Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Basic file checks
        run: |
          test -f README.md
          test -f NOTICE.md
          test -f LICENSE
          ! grep -rInE "C:\\Users\\[^\\]+|D:\\桌面" --include="*.md" --include="*.svg" .
