<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="shingja — Mechanical Engineering at USTB — cassette player banner"><desc>⁠​‌‌‌​​‌‌​‌‌​‌​​​​‌‌​‌​​‌​‌‌​‌‌‌​​‌‌​​‌‌‌​‌‌​‌​‌​​‌‌​​​​‌​​‌​‌‌​‌​‌‌‌​​​​​‌‌‌​​‌​​‌‌​‌‌‌‌​‌‌​​‌‌​​‌‌​‌​​‌​‌‌​‌‌​​​‌‌​​‌​‌​​‌​‌‌‌‌​‌‌‌​​‌‌​‌‌​‌​​​​‌‌​‌​​‌​‌‌​‌‌‌​​‌‌​​‌‌‌​‌‌​‌​‌​​‌‌​​​​‌​​‌​‌‌‌‌​​‌‌​​‌​​‌‌​​​​‌​​‌‌‌​​​​‌‌​​​‌​​‌‌​​‌​​​‌‌​​​‌‌​​‌‌​​‌‌​‌‌​​​‌​​​‌‌​‌​‌​​‌‌‌​​​​​‌‌​​​​​‌‌​​‌‌​⁠</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c14"/>
      <stop offset="0.55" stop-color="#171222"/>
      <stop offset="1" stop-color="#241528"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="beamPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b9d" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff6b9d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ff6b9d" fill-opacity="0.10"/>
    </pattern>
    <pattern id="grille" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#67e8f9" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <polygon points="700,0 950,0 720,420 540,420" fill="url(#beamPink)"/>
  <polygon points="980,0 1110,0 900,420 800,420" fill="url(#beamCyan)"/>
  <polygon points="1120,0 1200,0 1200,420 1020,420" fill="url(#beamYellow)"/>

  <!-- hanging charms: star, pick, heart -->
  <g stroke="#ff8fb1" stroke-width="1.2" stroke-opacity="0.55">
    <line x1="758" y1="0" x2="758" y2="58"/>
    <line x1="818" y1="0" x2="818" y2="40"/>
    <line x1="1162" y1="0" x2="1162" y2="30"/>
  </g>
  <g transform="translate(758 74)">
    <path d="M0 -18 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
  </g>
  <g transform="translate(818 54) rotate(-12)">
    <path d="M0 -18 C14 -18 24 -6 24 8 C24 22 12 34 0 34 C-12 34 -24 22 -24 8 C-24 -6 -14 -18 0 -18 Z" fill="#ff6b9d" stroke="#7a1f45" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#fff7ed">S</text>
  </g>
  <g transform="translate(1162 44)">
    <path d="M0 12 C-14 2 -22 -6 -22 -16 C-22 -24 -16 -30 -8 -30 C-3 -30 0 -26 0 -22 C0 -26 3 -30 8 -30 C16 -30 22 -24 22 -16 C22 -6 14 2 0 12 Z" fill="#ff6b9d" stroke="#7a1f45" stroke-width="1.5"/>
  </g>

  <!-- headphones -->
  <path d="M800 250 C800 150 1040 150 1040 250" fill="none" stroke="#ff8fb1" stroke-width="11" stroke-linecap="round"/>
  <rect x="780" y="226" width="40" height="68" rx="16" fill="#2a1b2e" stroke="#22d3ee" stroke-width="3"/>
  <rect x="1020" y="226" width="40" height="68" rx="16" fill="#2a1b2e" stroke="#22d3ee" stroke-width="3"/>
  <rect x="788" y="238" width="24" height="44" rx="10" fill="#161020" stroke="#ff6b9d" stroke-width="1.5"/>
  <rect x="1028" y="238" width="24" height="44" rx="10" fill="#161020" stroke="#ff6b9d" stroke-width="1.5"/>

  <!-- cassette player -->
  <g transform="translate(930 315)">
