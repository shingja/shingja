    <text x="0" y="17" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#8f7aa3" letter-spacing="1">MIXTAPE</text>
  </g>

  <!-- music notes and sparkles -->
  <g fill="#fde047">
    <circle cx="700" cy="190" r="5"/><rect x="704" y="150" width="3" height="40"/>
    <circle cx="1080" cy="250" r="4"/><rect x="1083" y="216" width="2" height="34"/>
  </g>
  <g>
    <path d="M690 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#22d3ee"/>
    <path d="M1150 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#ff9ec0"/>
    <path d="M860 80 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fde047"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(640 342)">
    <path d="M0 0 h128 a12 12 0 0 1 12 12 v30 a12 12 0 0 1 -12 12 h-82 l-18 18 v-18 h-28 a12 12 0 0 1 -12 -12 v-30 a12 12 0 0 1 12 -12 z"
          fill="#fff7ed" stroke="#ff6b9d" stroke-width="2.5"/>
    <text x="18" y="37" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#9d174d">社恐也要上台</text>
  </g>

  <!-- text -->
  <text x="78" y="152" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="80" font-weight="800" fill="#ff6b9d" fill-opacity="0.55" letter-spacing="1">shingja</text>
  <text x="72" y="146" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="80" font-weight="800" fill="#fff7ed" letter-spacing="1">shingja</text>
  <text x="76" y="198" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#d8c9e8" letter-spacing="0.5">Mechanical Engineering · USTB</text>

  <text x="76" y="244" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#b9a6c9" letter-spacing="4">SHARE · BUILD · WRITE</text>
  <rect x="76" y="262" width="158" height="4" rx="2" fill="#22d3ee"/>

  <text x="76" y="304" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8f7aa3" letter-spacing="1.5">INDEPENDENT BUILDER · BOCCHI THE ROCK! fan</text>
  <text x="76" y="330" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#7c6f91">不必要做的不做，必要做的尽快做</text>

  <text x="76" y="392" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#5f5570" letter-spacing="1">© 2026 shingja · github.com/shingja · CC BY-NC-SA 4.0</text>
