    <rect x="-150" y="-90" width="300" height="180" rx="20" fill="#2a1b2e" stroke="#22d3ee" stroke-width="4"/>
    <circle cx="-92" cy="0" r="54" fill="#161020" stroke="#ff6b9d" stroke-width="3"/>
    <circle cx="-92" cy="0" r="40" fill="url(#grille)"/>
    <circle cx="-92" cy="0" r="12" fill="#1a1420" stroke="#fde047" stroke-width="2"/>
    <rect x="-8" y="-62" width="144" height="74" rx="10" fill="#161020" stroke="#fde047" stroke-width="2"/>
    <rect x="6" y="-50" width="116" height="40" rx="6" fill="#12121a" stroke="#ff6b9d" stroke-width="1.5"/>
    <circle cx="38" cy="-30" r="9" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="88" cy="-30" r="9" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="38" cy="-30" r="3" fill="#fde047"/>
    <circle cx="88" cy="-30" r="3" fill="#fde047"/>
    <g fill="#fde047">
