      <rect x="16" y="22" width="18" height="10" rx="2"/>
      <rect x="40" y="22" width="18" height="10" rx="2"/>
      <rect x="64" y="22" width="18" height="10" rx="2"/>
    </g>
    <g fill="#ff6b9d">
      <circle cx="118" cy="26" r="9"/>
      <circle cx="118" cy="-2" r="9"/>
    </g>
    <circle cx="118" cy="54" r="6" fill="#67e8f9"/>
    <text x="0" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#8f7aa3" letter-spacing="2">SIDE A · SHINGJA</text>
  </g>

  <!-- floating cassette -->
  <g transform="translate(1102 138) rotate(10)">
    <rect x="-34" y="-22" width="68" height="44" rx="7" fill="#1a1420" stroke="#67e8f9" stroke-width="2"/>
    <rect x="-24" y="-10" width="48" height="20" rx="4" fill="#12121a" stroke="#ff6b9d" stroke-width="1.2"/>
    <circle cx="-12" cy="0" r="3" fill="#fde047"/>
